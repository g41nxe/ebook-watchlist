<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Ein Buch mit einem Preisschild-Abzeichen an der Ecke — dieselbe Geste, die
    die Oberfläche auf jedem Cover macht: das Buch ist die Sache, das Abzeichen
    sagt, warum es gerade zählt (ADR 20).

    Nachgezeichnet statt als PNG eingebunden: so schärft es mit dem Bildschirm
    mit und kann auf Hell/Dunkel reagieren. Der schwarze Ring des Abzeichens
    wird im Dunkelmodus hell — sonst verschwände er in einer dunklen
    Tab-Leiste, und das Abzeichen zerfiele in zwei Flecken.

    Das Schild im Abzeichen ist gefüllt und nicht als Umriss gezeichnet: bei
    16 Pixeln ist ein Umriss von einem Viertelpixel nichts mehr.
  -->
  <!--
    Die Farben sind die der Oberfläche, nicht eigene: das Buch traegt das
    Gruen der Bibliothek (die Marke `color-accent`), das Abzeichen das Bernstein des
    Shops (`color-amber`) — dieselbe Zuordnung, die jede Zeile der Liste
    macht. Vorher war das Buch blattgruen und die Marke sandfarben; das war
    huebsch und gehoerte zu nichts.

    Ausgeschrieben als Hex, nicht als oklch() oder var(): ein Favicon wird
    ohne das Stilblatt der Seite gezeichnet, und manche Zeichner (Tab-Leisten,
    Lesezeichen, das Betriebssystem) sind alt. Die Werte sind aus den Marken
    der Oberflaeche umgerechnet und stehen daneben.
  -->
  <style>
    .deckel { fill: #28605a }  /* --color-accent  oklch(0.45 0.06 185) */
    .ruecken{ fill: #124641 }  /* dasselbe, dunkler: der Ruecken liegt hinten */
    .zeile  { fill: #85aea8 }  /* dasselbe, heller: Schrift auf dem Deckel */
    .ring   { fill: #29231e }  /* --color-ink */
    .marke  { fill: #876125 }  /* --color-amber  oklch(0.52 0.09 75) */
    .schild { fill: #faf8f4 }  /* --color-paper */
    @media (prefers-color-scheme: dark) {
      .deckel { fill: #6da59d }  /* --color-accent (dunkel) */
      .ruecken{ fill: #467d76 }
      .zeile  { fill: #b9d9d4 }
      .ring   { fill: #e6e4e0 }  /* --color-ink (dunkel) */
      .marke  { fill: #ccac76 }  /* --color-amber (dunkel) */
      .schild { fill: #0f0f13 }  /* --color-paper (dunkel) */
    }
  </style>

  <!-- Der Buchdeckel mit abgesetztem Rücken. -->
  <rect class="deckel" x="4" y="4" width="18.6" height="24" rx="1.6"/>
  <path class="ruecken" d="M5.6 4H7v24H5.6A1.6 1.6 0 0 1 4 26.4V5.6A1.6 1.6 0 0 1 5.6 4z"/>

  <!-- Drei Zeilen als Andeutung von Schrift. -->
  <rect class="zeile" x="9.1" y="10.0" width="8.4" height="1.5" rx="0.75"/>
  <rect class="zeile" x="9.1" y="13.0" width="5.4" height="1.5" rx="0.75"/>
  <rect class="zeile" x="9.1" y="21.3" width="5.4" height="1.5" rx="0.75"/>

  <!-- Das Abzeichen an der oberen rechten Ecke. -->
  <circle class="ring" cx="23.2" cy="8.8" r="5.9"/>
  <circle class="marke" cx="23.2" cy="8.8" r="4.85"/>
  <g transform="rotate(-45 23.2 8.8)">
    <path class="schild"
          d="M20.3 6.5h4.6a1.1 1.1 0 0 1 1.1 1.1v2.4a1.1 1.1 0 0 1-1.1 1.1h-4.6l-1.5-1.65V8.15z"/>
    <circle class="marke" cx="20.9" cy="8.8" r="0.85"/>
  </g>
</svg>
