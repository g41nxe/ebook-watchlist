<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}eBook-Watchlist{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body class="m-0 font-sans text-[15px]/[1.55] antialiased">

{# Ein Sprite statt einer Icon-Schrift: keine Fremdanfrage, kein Nachladen,
   und die Icons erben Farbe und Groesse vom Text (ADR 20). #}
<svg class="hidden" aria-hidden="true">
  <symbol id="ic-book" viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/></symbol>
  <symbol id="ic-doc" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4M9 13h6M9 17h4"/></symbol>
  <symbol id="ic-warn" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5h.01"/></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
  <symbol id="ic-plug" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></symbol>
  <symbol id="ic-tag" viewBox="0 0 24 24"><path d="M3 11V4a1 1 0 0 1 1-1h7l9 9-8 8z"/><circle cx="7.5" cy="7.5" r="1.2"/></symbol>
</svg>

<header class="sticky top-0 z-20 border-b border-rule bg-card/85 backdrop-blur">
  <div class="mx-auto flex max-w-3xl items-center gap-3 px-6 py-3">
    <svg class="i text-[19px] text-accent"><use href="#ic-book"/></svg>
    <div>
      <div class="font-semibold tracking-tight">eBook-Watchlist</div>
      {% block subtitle %}{% endblock %}
    </div>
  </div>
</header>

<main class="mx-auto max-w-3xl px-6 pt-8 pb-24">
{% block content %}{% endblock %}
</main>

</body>
</html>
