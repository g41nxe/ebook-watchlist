<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Buch und Preisschild — die beiden Dinge, um die es geht, in den beiden
    Farben, die in der Oberfläche überall dasselbe bedeuten: grün =
    Bibliothek, bernstein = Shop (ADR 20).

    Zwei Formen, keine dünnen Linien: bei 16 Pixeln überlebt nichts Feineres.
    Das Schild hat eine Spitze — ohne sie liest es sich als Raute und nicht
    als Anhänger; das war bei 160 Pixeln zu sehen und bei 16 erst recht.

    Als SVG und nicht als PNG: schärft mit dem Bildschirm mit und reagiert auf
    Hell/Dunkel — ein dunkelgrünes Buch verschwindet sonst in einer dunklen
    Tab-Leiste.

    Der helle Spalt zwischen Schild und Buch ist keine Farbe, sondern eine
    Aussparung, damit er auf jedem Untergrund sichtbar bleibt.
  -->
  <style>
    .buch   { fill: #10705e }
    .schild { fill: #e9a02b }
    @media (prefers-color-scheme: dark) {
      .buch   { fill: #4fb39c }
      .schild { fill: #f0b04e }
    }
  </style>

  <defs>
    <!-- Das Schild, um 1.6 aufgedickt: das ist der Spalt. -->
    <path id="anhaenger"
          d="M17.9 12.4h8.3A1.8 1.8 0 0 1 28 14.2v8.3a1.8 1.8 0 0 1-3.07 1.27l-8.3-8.3A1.8 1.8 0 0 1 17.9 12.4z"/>
    <mask id="spalt">
      <rect width="32" height="32" fill="#fff"/>
      <use href="#anhaenger" fill="#000" stroke="#000" stroke-width="3.2"
           stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Das Buch: Deckel und darunter der Buchblock, wie ein stehendes Buch. -->
  <g mask="url(#spalt)">
    <path class="buch"
          d="M5.5 6.5A2.5 2.5 0 0 1 8 4h11.5A2.5 2.5 0 0 1 22 6.5V21.6H9.1a1.2 1.2 0 0 0 0 2.4H22V28H8a2.5 2.5 0 0 1-2.5-2.5z"/>
  </g>

  <!-- Das Preisschild mit Loch, quer über die untere Ecke. -->
  <use href="#anhaenger" class="schild"/>
  <circle cx="24.4" cy="16" r="1.75" fill="#faf8f4"/>
</svg>
