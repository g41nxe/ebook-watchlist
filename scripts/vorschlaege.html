<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vorschläge</title>
<!--
  Die Szene für den Screenshot der Vorschlagsseite. War lange das Titelbild
  der README, aufgenommen mit scripts/make_hero.py; das Titelbild ist jetzt
  eine Illustration (docs/bilder/hero.jpg). Die Szene selbst tut weiter ihren
  Dienst, nur unter ihrem eigenen Namen statt als "hero".

  Aufnahme: scripts/make_screenshots.py vorschlaege (Chrome im Kopflos-Modus,
  keine neue Abhängigkeit).

  Die Farben sind die der Anwendung: tiefes Grün als Raum, ein warmer
  bernsteinfarbener Lichtschein — grün = Bibliothek, bernstein = Shop.
-->
<style>
  :root {
    --gruen-tief: #0d2b26;
    --gruen: #143f37;
    --bernstein: #e9a02b;
    --papier: #faf8f4;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; padding: 0 }
  body {
    width: 1600px; height: 900px;
    display: grid; place-items: center;
    background: var(--gruen-tief);
    font: 15px system-ui, sans-serif;
    overflow: hidden;
  }

  /* Der Lichtschein von oben rechts — dieselbe Idee wie das Abzeichen auf
     einem Cover: eine warme Stelle in einem kühlen Feld. */
  .raum {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 82% 8%, rgba(233,160,43,.20), transparent 55%),
      radial-gradient(90% 70% at 20% 100%, rgba(20,63,55,.9), transparent 60%);
  }

  /* Ein feines Raster, damit die Fläche nicht tot wirkt. */
  .raster {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(70% 60% at 50% 45%, #000, transparent 75%);
  }

  .fenster {
    position: relative;
    width: 1240px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--papier);
    box-shadow:
      0 2px 4px rgba(0,0,0,.25),
      0 30px 60px -12px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.08);
  }

  .leiste {
    height: 42px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: #ecebe6;
    border-bottom: 1px solid #dcdad4;
  }
  .punkt { width: 11px; height: 11px; border-radius: 50% }
  .p1 { background: #e06c60 } .p2 { background: #e5b64a } .p3 { background: #74c07a }
  .pille {
    margin-left: 12px; flex: 1;
    height: 24px; border-radius: 12px;
    background: #f7f6f2; border: 1px solid #dcdad4;
    display: flex; align-items: center; gap: 7px;
    padding: 0 10px;
    color: #6b6862; font-size: 12px;
  }
  .pille svg { width: 13px; height: 13px }

  iframe { display: block; width: 100%; height: 660px; border: 0 }
</style>
</head>
<body>
<div class="raum"></div>
<div class="raster"></div>

<div class="fenster">
  <div class="leiste">
    <span class="punkt p1"></span><span class="punkt p2"></span><span class="punkt p3"></span>
    <span class="pille">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#10705e"
              d="M5.5 6.5A2.5 2.5 0 0 1 8 4h11.5A2.5 2.5 0 0 1 22 6.5V21.6H9.1a1.2 1.2 0 0 0 0 2.4H22V28H8a2.5 2.5 0 0 1-2.5-2.5z"/>
      </svg>
      localhost:8439/vorschlaege
    </span>
  </div>
  <iframe src="http://127.0.0.1:8439/vorschlaege" scrolling="no"></iframe>
</div>
</body>
</html>
