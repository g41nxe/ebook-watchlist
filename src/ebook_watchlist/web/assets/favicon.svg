<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Ein Buchrücken mit einem Preisschild — die beiden Dinge, um die es geht,
    in den beiden Farben, die in der Oberfläche überall dasselbe bedeuten:
    grün = Bibliothek, bernstein = Shop (ADR 20).

    Gezeichnet, nicht erzeugt: bei 16 Pixeln überlebt kein Foto, und ein SVG
    schärft mit dem Bildschirm mit. Die Farben folgen dem Hell/Dunkel des
    Browsers, sonst verschwindet ein dunkelgrünes Buch in einer dunklen
    Tab-Leiste.
  -->
  <style>
    .buch  { fill: #28605a }
    .rueck { fill: #1b4640 }
    .band  { fill: #faf8f4 }
    .schild{ fill: #876125 }
    .loch  { fill: #faf8f4 }
    @media (prefers-color-scheme: dark) {
      .buch  { fill: #82bbb3 }
      .rueck { fill: #4d8b84 }
      .band  { fill: #17302d }
      .schild{ fill: #b7933f }
      .loch  { fill: #17302d }
    }
  </style>

  <!-- Das Buch: stehend, mit abgesetztem Rücken und zwei Zierlinien. -->
  <rect class="buch" x="3" y="3" width="14" height="26" rx="1.6"/>
  <rect class="rueck" x="3" y="3" width="3.6" height="26" rx="1.6"/>
  <rect class="band" x="9" y="8.5" width="6" height="1.4" rx="0.7"/>
  <rect class="band" x="9" y="12" width="4" height="1.4" rx="0.7"/>

  <!-- Das Preisschild, halb über die Buchkante gelegt. -->
  <g transform="rotate(-42 22 21)">
    <path class="schild"
          d="M16 17.4h11.4a1.4 1.4 0 0 1 1.4 1.4v4.4a1.4 1.4 0 0 1-1.4 1.4H16l-2.6-3z"/>
    <circle class="loch" cx="17.4" cy="21" r="1.35"/>
  </g>
</svg>
