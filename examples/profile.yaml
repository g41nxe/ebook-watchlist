# Copy to data/profile.yaml and edit.
slug: default
name: Meine Leseliste

# Deal thresholds in cents (see CONTEXT.md).
strong_deal_max_cents: 500   # unter 5,00 € = Strong Deal, ohne Rabatt-Check
deal_max_cents: 1000         # 5,00-9,99 € nur mit echtem Rabatt
min_discount_pct: 25

# Wie viele Urteile das Bewertungstor pro Lauf höchstens einholt (ADR 19).
# Der erste Lauf mit einem ANTHROPIC_API_KEY trifft den ganzen Rückstand; er
# arbeitet ihn über mehrere Läufe ab. Was übrig bleibt, gilt als unbewertet
# und wird gezeigt.
# Wieviele Bücher in einen Modellaufruf gehen. Ein Bündel spart den Großteil
# des Prompts — aber ein Modell, das zwanzig Dinge in einer Antwort beurteilt,
# ankert aneinander. Kleiner setzen, um das zu messen.
rating_batch_size: 20
# Welches Modell urteilt. Leer lassen für die Voreinstellung.
rating_model:
rating_budget: 40

# Wie viele Zeilen die Startseite je Abschnitt zeigt: oben die Angebote aus
# der Watchlist, darunter die offenen Entscheidungen. Der Rest haengt am
# Verweis daneben. Das haengt an deinem Bildschirm, nicht am Werkzeug.
home_offers: 5
home_suggestions: 3

# Either a plain list, or split into a list swept every run and a long tail
# swept once a week.
reference_authors:
  core: []
  extended: []
extended_sweep_weekday: 6  # 0 = Monday

# Shop category paths whose new arrivals are surfaced as suggestions (ticket 07).
genre_categories: []

# Dormant in v1.
no_gos: []
liked_books: []
disliked_books: []

# Appended to the outgoing User-Agent so a site operator can reach you.
# Optional, and nothing personal is sent unless you fill it in yourself.
# contact: mailto:du@example.org

sources:
  voebb:
    # Which formats to watch. The Onleihe lists the ebook and the audiobook of a
    # novel as two separate titles, so without a preference neither can win.
    media: [ebook]
  beam:
  # A canned source for trying the pipeline out without touching the network.
  # fake:
  #   fixture: fake-source.yaml
