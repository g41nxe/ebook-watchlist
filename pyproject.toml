[project]
name = "ebook-watchlist"
version = "0.1.0"
description = "Watches library availability and shop prices for a personal ebook watchlist"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "filelock>=3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_watchlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits a real source over the network; excluded by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
